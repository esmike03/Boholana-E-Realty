{% load humanize %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f4f4f5;
            color: #111827;
        }
        .wrapper {
            max-width: 600px;
            margin: 32px auto;
            background: white;
            border: 1px solid #e5e7eb;
        }
        .header {
            background: #0f2942;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title {
            color: #f0a500;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header-sub {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            margin-top: 2px;
        }
        .content {
            padding: 32px;
        }
        .label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f0a500;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            line-height: 1.3;
            margin-bottom: 16px;
        }
        p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .info-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 20px 24px;
            margin: 20px 0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 13px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #9ca3af; min-width: 140px; }
        .info-value { color: #111827; font-weight: 500; text-align: right; }
        .btn {
            display: inline-block;
            background: #0f2942;
            color: white !important;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
        }
        .btn:hover { background: #f0a500; }
        .btn-gold {
            background: #f0a500;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 20px;
        }
        .status-approved { background: #dcfce7; color: #16a34a; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-rejected { background: #fee2e2; color: #dc2626; }
        .status-cancelled { background: #f3f4f6; color: #6b7280; }
        .footer {
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            padding: 20px 32px;
            text-align: center;
        }
        .footer p {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .footer a {
            color: #f0a500;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="wrapper">

    <!-- Header -->
    <div class="header">
        <div>
            <div class="header-title">Boholana E-Realty</div>
            <div class="header-sub">Tagbilaran City, Bohol, Philippines</div>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        {% block email_content %}{% endblock %}
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2025 Boholana E-Realty. All rights reserved.</p>
        <p>Tagbilaran City, Bohol, Philippines</p>
        <a href="http://127.0.0.1:8000">Visit Website</a>
    </div>

</div>
</body>
</html>
