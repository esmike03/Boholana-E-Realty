{% extends 'public_base.html' %}
{% block title %}Page Not Found — Boholana E-Realty{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="text-center px-6">
        <div class="text-8xl font-bold mb-4"
             style="background: linear-gradient(135deg, #0f2942, #1a4a7a);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;">
            404
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-3">Page Not Found</h2>
        <p class="text-gray-500 mb-8 max-w-md mx-auto">
            The page you are looking for might have been removed,
            had its name changed, or is temporarily unavailable.
        </p>
        <div class="flex gap-4 justify-center">
            <a href="{% url 'home' %}"
               class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl text-sm font-semibold transition">
                <i class="fas fa-home mr-2"></i>Go Home
            </a>
            <a href="{% url 'properties' %}"
               class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-xl text-sm font-semibold transition">
                Browse Properties
            </a>
        </div>
    </div>
</div>
{% endblock %}
