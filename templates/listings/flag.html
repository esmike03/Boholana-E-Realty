{% extends 'base.html' %}
{% block title %}Flag Listing{% endblock %}
{% block page_title %}Flag for Review{% endblock %}
{% load humanize %}
{% block content %}
<div class="max-w-lg">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-4 mb-5">
            <div class="bg-orange-100 rounded-xl p-3">
                <i class="fas fa-flag text-orange-600 text-xl"></i>
            </div>
            <div>
                <h3 class="font-semibold text-gray-800">Flag for Review</h3>
                <p class="text-gray-400 text-sm">{{ property.title }}</p>
            </div>
        </div>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">
                    Flag Reason <span class="text-red-500">*</span>
                </label>
                <select name="reason" required
                        class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 bg-gray-50 mb-3">
                    <option value="">Select a reason</option>
                    <option value="Incomplete information">Incomplete information</option>
                    <option value="Inaccurate details">Inaccurate details</option>
                    <option value="Policy violation">Policy violation</option>
                    <option value="Duplicate entry">Duplicate entry</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="flex gap-3">
                <button type="submit"
                        class="flex-1 bg-orange-600 hover:bg-orange-700 text-white py-2.5 rounded-xl text-sm font-semibold transition">
                    <i class="fas fa-flag mr-2"></i>Flag Listing
                </button>
                <a href="{% url 'listings:detail' property.pk %}"
                   class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 py-2.5 rounded-xl text-sm font-semibold transition text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
