{% extends 'base.html' %}
{% block title %}Approve Listing{% endblock %}
{% block page_title %}Approve Listing{% endblock %}
{% load humanize %}
{% block content %}
<div class="max-w-lg">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-4 mb-5">
            <div class="bg-green-100 rounded-xl p-3">
                <i class="fas fa-check text-green-600 text-xl"></i>
            </div>
            <div>
                <h3 class="font-semibold text-gray-800">Approve Listing</h3>
                <p class="text-gray-400 text-sm">{{ property.title }}</p>
            </div>
        </div>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">Remarks (optional)</label>
                <textarea name="remarks" rows="3"
                          placeholder="Add approval notes..."
                          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50 resize-none"></textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl text-sm font-semibold transition">
                    <i class="fas fa-check mr-2"></i>Approve
                </button>
                <a href="{% url 'listings:detail' property.pk %}"
                   class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 py-2.5 rounded-xl text-sm font-semibold transition text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
