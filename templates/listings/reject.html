{% extends 'base.html' %}
{% block title %}Reject Listing{% endblock %}
{% block page_title %}Reject Listing{% endblock %}

{% block content %}
<div class="max-w-lg">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-4 mb-5">
            <div class="bg-red-100 rounded-xl p-3">
                <i class="fas fa-times text-red-600 text-xl"></i>
            </div>
            <div>
                <h3 class="font-semibold text-gray-800">Reject Listing</h3>
                <p class="text-gray-400 text-sm">{{ property.title }}</p>
            </div>
        </div>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">
                    Reason for rejection <span class="text-red-500">*</span>
                </label>
                <textarea name="reason" rows="3" required
                          placeholder="Explain why this listing is being rejected..."
                          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 bg-gray-50 resize-none"></textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl text-sm font-semibold transition">
                    <i class="fas fa-times mr-2"></i>Reject
                </button>
                <a href="{% url 'listings:detail' property.pk %}"
                   class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 py-2.5 rounded-xl text-sm font-semibold transition text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
